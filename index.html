<title>赤ずきんの英文ラボ</title>
<style>
:root{font:17px/1.65 system-ui,sans-serif;color:#211e29;background:#f7f3ed;--red:#9e2945;--green:#234d42;--muted:#655e69;--line:#e3d9d5}*{box-sizing:border-box}body{margin:0}header{background:#263d36;color:#fff8ed;padding:2.7rem 1.2rem 2.4rem;border-bottom:6px solid #ad3854}header div,main{max-width:780px;margin:auto}h1{margin:0;font-size:clamp(2rem,6.5vw,3.15rem);line-height:1.2}header p{margin:.75rem 0 0;color:#f1dfd4}main{padding:1.4rem 1rem 3rem}h2{line-height:1.35;margin:.45em 0 .6em}button{min-height:46px;font:inherit}button{cursor:pointer;border-radius:12px;padding:.55rem .95rem;border:1px solid var(--line);background:white;color:inherit;text-align:left}button:hover:not(:disabled){border-color:var(--red);background:#fff2f4}button:focus-visible,summary:focus-visible{outline:3px solid #ac4160;outline-offset:3px}button:disabled{cursor:default}button.primary{background:#8e2441;color:white;border-color:#8e2441}button.primary:hover:not(:disabled){background:#6e1830;color:white}.card{background:#fffefa;border:1px solid var(--line);border-radius:20px;padding:clamp(1rem,4vw,2rem);box-shadow:0 8px 30px #4129380a}.modes,.actions{display:flex;gap:.65rem;flex-wrap:wrap;margin:1rem 0}.modes button{flex:1 1 145px}.choices{display:grid;gap:.55rem}.choices button.correct{background:#e5f3eb;border-color:#387256}.choices button.wrong{background:#fbe8eb;border-color:#a94860}.en{font-family:Georgia,serif;font-size:1.2em}.muted{color:var(--muted)}.stats{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.35rem;color:var(--green);font-weight:650}progress{width:100%;height:10px;accent-color:var(--red)}summary{cursor:pointer;color:var(--green);font-weight:700}details{margin:1.3rem 0 0;border:1px solid var(--line);border-radius:12px;background:#fffefa;padding:.8rem 1rem}.feedback{margin-top:.8rem}.feedback:empty{display:none}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}.pairs div{display:grid;gap:.5rem;align-content:start}.pairs button{overflow-wrap:anywhere}.pairs .selected{background:#f8e2ea;border-color:#9e2945}.pairs .matched{background:#e5f3eb;color:#234d42}.pairs .miss{background:#fbe8eb;border-color:#a94860}[hidden]{display:none!important}.submission{margin-top:1.3rem}.submission h2{font-size:1.2rem}.submission input{font:inherit;min-height:46px;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:.4rem .6rem}.submission form{display:flex;align-items:end;flex-wrap:wrap;gap:.7rem}.submission label{display:grid;gap:.25rem}.submission input:focus-visible{outline:3px solid #ac4160;outline-offset:3px}

<body>
<header><div><h1>赤ずきんの英文ラボ</h1><p>物語と入試英文で、読解と言い換えを練習</p></div></header>
<main>
<section id="locked" class="card" aria-live="polite">教材を読み込んでいます。</section>
<div id="app" hidden>
<section class="card" id="menu">
<div class="modes">
<button data-mode="reading" id="readingMode" class="primary">入試版の内容一致</button>
<button data-mode="words">シノニムクイズ</button>
<button data-mode="pairs">ペア合わせ</button>
<button data-mode="review" id="review">間違いを復習</button>
</div>
<p class="muted" id="note"></p>
</section>
<section class="card" id="quiz" hidden aria-labelledby="prompt">
<div class="stats"><span id="count"></span><span id="streak"></span></div>
<progress id="bar" aria-label="進み具合"></progress>
<h2 id="prompt" tabindex="-1"></h2>
<div id="choices" class="choices"></div>
<div id="feedback" class="feedback" role="status"></div>
<div class="actions"><button id="next" class="primary" hidden>次の問題</button><button id="home">メニューに戻る</button></div>
</section>
<section class="card submission" aria-labelledby="submission-heading">
<h2 id="submission-heading">課題の提出</h2>
<p id="assignment-progress"></p>
<form id="submit-result" hidden>
<label>名前 <input id="student-name" type="text" name="name" maxlength="60" required autocomplete="off"></label>
<button id="send-result" class="primary" type="submit">結果を送信</button>
</form>
<button id="restart-assignment" type="button" hidden>別の生徒として始める</button>
<p id="submission-status" class="feedback" role="status"></p>
</section>
<details id="passages"><summary>英文を読む</summary><div id="texts"></div></details>
</div>
</main>

};

    $("choices").className="choices";
    $("feedback").textContent=mode==="reading"?"": "最高連続正解 "+best+"。";
    $("feedback").textContent+=pending().length?"復習リストに "+pending().length+" 問あります。":"復習リストは空です。";
    if(pending().length) button("間違いだけもう一度",$("choices"),()=>run("review"));
    button("この練習をもう一度",$("choices"),()=>run(mode));
    $("next").hidden=true;
    $("prompt").removeAttribute("lang");
    $("prompt").focus();
  }
  function complete() {
    answered=true; progress();
    $("next").textContent=index===queue.length-1?"結果を見る":mode==="pairs"?"次のセット":"次の問題";
    $("next").hidden=false;
    $("next").focus();
  }
  function render() {
    version++; answered=false;
    const item=queue[index];
    $("choices").replaceChildren();
    $("choices").className="choices";
    $("feedback").textContent="";
    $("next").hidden=true;
    $("prompt").removeAttribute("lang");
    $("count").textContent=(mode==="pairs"?"ペア合わせ":labels[item.unit])+"　"+(index+1)+" / "+queue.length;
    progress();
    if(mode==="pairs"){
      showTexts(); match(item);
    } else {
      showTexts(item.unit); question(item);
    }
    $("prompt").focus();
  }
  function question(item) {
    const readingItem=item.type==="reading";
    const reverse=!readingItem && Math.random()<.35;
    const expected=readingItem?item.answer:reverse?item.term:shuffle(item.aliases)[0];
    $("prompt").textContent=readingItem?item.prompt:reverse?"元の表現は？ “"+item.aliases[0]+"”":"近い意味は？ “"+item.term+"”";
    const alternatives=readingItem
      ? ["一致する","一致しない"]
      : shuffle(words.filter(w=>w.id!==item.id && !overlap(w,item))).slice(0,3).map(w=>reverse?w.term:w.aliases[0]).concat(expected);
    const options=readingItem?alternatives:shuffle(alternatives);
    for(const choice of options) {
      button(choice,$("choices"),(event)=>{
        if(answered) return;
        const correct=choice===expected;
        if((mode==="reading" || mode==="words") && !Object.hasOwn(assignment.answers,item.id)) {
          assignment.answers[item.id]=correct;
          saveAssignment();
          updateSubmission();
        }
        record(item,correct); score(correct);
        for(const b of $("choices").children) {
          b.disabled=true;
          if(b.textContent===expected) b.classList.add("correct");
        }
        if(!correct) event.currentTarget.classList.add("wrong");
        const explanation=readingItem?item.explanation:item.term+" ＝ "+item.aliases.join(" / ")+"（"+item.meaning+"）";
        $("feedback").textContent=(correct?"○ 正解。":"× 正解は「"+expected+"」。")+" "+explanation;
        complete();
      },readingItem?null:"en");
    }
  }
  function match(group) {
    const container=$("choices");
    container.classList.add("pairs");
    $("prompt").textContent="同じ意味のカードを組み合わせよう";
    const left=document.createElement("div"), right=document.createElement("div");
    container.append(left,right);
    const marks=new Map(), missed=new Set();
    round={left:null,right:null,matched:0,busy:false};
    function select(side,item,b) {
      if(round.busy||answered) return;
      const prior=round[side];
      if(prior) {prior.b.classList.remove("selected"); prior.b.setAttribute("aria-pressed","false");}
      if(prior?.item.id===item.id) {round[side]=null;return;}
      round[side]={item,b};
      b.classList.add("selected"); b.setAttribute("aria-pressed","true");
      if(!round.left || !round.right) return;
      const a=round.left, c=round.right;
      round.left=round.right=null;
      a.b.classList.remove("selected"); c.b.classList.remove("selected");
      a.b.setAttribute("aria-pressed","false"); c.b.setAttribute("aria-pressed","false");
      if(a.item===c.item){
        const firstTry=!missed.has(a.item.id);
        if(firstTry) {record(a.item,true); score(true);}
        round.matched++;
        for(const matched of marks.get(a.item.id)){matched.disabled=true; matched.classList.add("matched");}
        $("feedback").textContent="○ "+a.item.term+"（"+a.item.meaning+"）　"+round.matched+" / "+group.length+" 組";
        if(round.matched===group.length) complete();
        else left.querySelector("button:not(:disabled)")?.focus();
      } else {
        missed.add(a.item.id); missed.add(c.item.id);
        record(a.item,false); record(c.item,false); score(false);
        $("feedback").textContent="× 違う組み合わせ。別のカードを選んでみよう。";
        round.busy=true;
        const current=version;
        a.b.classList.add("miss"); c.b.classList.add("miss");
        setTimeout(()=>{if(current===version){a.b.classList.remove("miss");c.b.classList.remove("miss");round.busy=false;}},340);
      }
    }
    for(const [side,element] of [["left",left],["right",right]]) {
      element.setAttribute("aria-label",side==="left"?"本文の表現":"言い換え");
      for(const item of shuffle(group)){
        const b=button(side==="left"?item.term:item.aliases[0],element,()=>select(side,item,b),"en");
        b.setAttribute("aria-pressed","false");
        marks.set(item.id,[...(marks.get(item.id)||[]),b]);
      }
    }
  }
  $("submit-result").onsubmit=submitResult;
  $("restart-assignment").onclick=()=>{
    if(!window.confirm("このブラウザーの進捗と復習リストを消して、新しく始めますか？")) return;
    assignment={answers:{},submission:null};
    mistakes.clear();
    saveAssignment();
    try { localStorage.removeItem(keyName); } catch { saved=false; }
    $("student-name").value="";
    $("student-name").readOnly=false;
    $("submission-status").textContent="";
    menu(true);
  };
  $("home").onclick=()=>menu(true);
  $("next").onclick=advance;
  for(const b of document.querySelectorAll("[data-mode]")) b.onclick=()=>run(b.dataset.mode);
  $("locked").hidden=true; $("app").hidden=false;
  menu();
}
window.addEventListener("hashchange",()=>location.reload());
start().catch(()=>{$("locked").textContent="教材を開くには、末尾に鍵が付いた共有リンクを使ってください。";});
</script>
</body>
</html>
